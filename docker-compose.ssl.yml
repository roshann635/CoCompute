# SSL overlay — use with: docker-compose -f docker-compose.yml -f docker-compose.ssl.yml up
services:
  dashboard:
    ports:
      - "443:443"
      - "3000:80"
    volumes:
      - ./ssl/certs:/etc/nginx/ssl:ro
      - ./dashboard/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    environment:
      MASTER_IP: dashboard
      MASTER_PORT: 443
      USE_TLS: "true"
      TLS_VERIFY: "false"
